<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Obfuscator & Deobfuscator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d0d18;color:#e0e0e0;min-height:100vh;padding:16px}
  header{text-align:center;margin-bottom:10px}
  header h1{font-size:26px;background:linear-gradient(90deg,#a855f7,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
  header p{color:#888;font-size:13px;margin-top:4px}
  .container{max-width:1300px;margin:0 auto}
  
  /* Toggle Mode */
  .mode-switch{display:flex;justify-content:center;gap:10px;margin:15px 0}
  .mode-btn{background:#1a1a2e;color:#888;border:1px solid #2d2d44;padding:8px 24px;border-radius:20px;cursor:pointer;font-weight:600;transition:0.2s}
  .mode-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
  
  /* Options */
  .opts{display:flex;gap:14px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;font-size:13px;color:#b0b0c0;min-height:20px}
  .opts label{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
  .opts input[type=checkbox]{accent-color:#a855f7;cursor:pointer}
  .opts.hidden{display:none}
  
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:768px){.grid{grid-template-columns:1fr}}
  .panel{background:#16162a;border:1px solid #2d2d44;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .panel-header{padding:9px 12px;background:#12121e;border-bottom:1px solid #2d2d44;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:#9a9aad}
  .panel-header .size{font-weight:400;color:#666;font-size:11px}
  textarea{flex:1;min-height:400px;background:#0a0a14;color:#e0e0e0;border:none;padding:12px;font-family:Consolas,Monaco,monospace;font-size:12.5px;line-height:1.5;resize:vertical;outline:none}
  
  .controls{margin:14px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{padding:10px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
  button:disabled{opacity:.4;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,#a855f7,#3b82f6);color:#fff}
  .btn-primary:hover:not(:disabled){filter:brightness(1.15)}
  .btn-success{background:#16a34a;color:#fff}
  .btn-success:hover:not(:disabled){background:#15803d}
  .btn-secondary{background:#2d2d44;color:#d0d0e0}
  .btn-secondary:hover:not(:disabled){background:#3a3a55}
  .stats{text-align:center;font-size:12.5px;color:#888;margin:6px 0;min-height:20px}
  .stats strong{color:#a855f7}
  .stats .ok{color:#22c55e;font-weight:600}
  .stats .err{color:#ef4444;font-weight:600}
  footer{text-align:center;margin-top:20px;color:#555;font-size:11px}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🔒 Lua Obfuscator & Deobfuscator</h1>
    <p>Xáo trộn hoặc Làm đẹp / Dịch ngược code Lua</p>
  </header>

  <div class="mode-switch">
    <button class="mode-btn active" id="btn-mode-obf" onclick="setMode('obf')">Obfuscate (Xáo trộn)</button>
    <button class="mode-btn" id="btn-mode-deobf" onclick="setMode('deobf')">Deobfuscate (Giải mã)</button>
  </div>

  <div class="opts" id="obfOptions">
    <label><input type="checkbox" id="optRename" checked> Đổi tên biến local</label>
    <label><input type="checkbox" id="optStrings" checked> Mã hóa string</label>
    <label><input type="checkbox" id="optMinify" checked> Minify</label>
  </div>
  
  <div class="opts hidden" id="deobfOptions">
    <span>Chế độ: Làm đẹp code & Dịch ngược chuỗi (String Decoder)</span>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-header"><span id="lblInput">Input (Lua)</span><span class="size" id="inSize">0 ký tự</span></div>
      <textarea id="input" spellcheck="false" placeholder="Dán code vào đây..."></textarea>
    </div>
    <div class="panel">
      <div class="panel-header"><span id="lblOutput">Output</span><span class="size" id="outSize">0 ký tự</span></div>
      <textarea id="output" readonly spellcheck="false" placeholder="Kết quả..."></textarea>
    </div>
  </div>

  <div class="controls">
    <button class="btn-primary" id="actionBtn" onclick="run()">⚡ Obfuscate</button>
    <button class="btn-success" id="copyBtn" onclick="copyOut()" disabled>📋 Copy</button>
    <button class="btn-secondary" id="dlBtn" onclick="download()" disabled>💾 Download .lua</button>
    <button class="btn-secondary" onclick="clearAll()">🗑️ Clear</button>
  </div>

  <div class="stats" id="stats"></div>
  <footer>Dùng cho mục đích hợp pháp.</footer>
</div>

<script>
"use strict";
let currentMode = 'obf'; // 'obf' hoặc 'deobf'

/* ===================== TOGGLE MODE ===================== */
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-mode-obf').classList.toggle('active', mode === 'obf');
  document.getElementById('btn-mode-deobf').classList.toggle('active', mode === 'deobf');
  
  document.getElementById('obfOptions').classList.toggle('hidden', mode !== 'obf');
  document.getElementById('deobfOptions').classList.toggle('hidden', mode !== 'deobf');
  
  const btn = document.getElementById('actionBtn');
  if (mode === 'obf') {
    btn.textContent = '⚡ Obfuscate';
    btn.style.background = 'linear-gradient(135deg,#a855f7,#3b82f6)';
    document.getElementById('lblInput').textContent = 'Input (Lua gốc)';
    document.getElementById('lblOutput').textContent = 'Output (Đã xáo trộn)';
  } else {
    btn.textContent = '🔍 Deobfuscate';
    btn.style.background = '#eab308'; // Màu vàng
    btn.style.color = '#000';
    document.getElementById('lblInput').textContent = 'Input (Code bị xáo trộn)';
    document.getElementById('lblOutput').textContent = 'Output (Code đã làm sạch)';
  }
  document.getElementById('stats').innerHTML = '';
}

/* ===================== TOKENIZER ===================== */
const KEYWORDS = new Set(['and','break','do','else','elseif','end','false','for','function','if','in','local','nil','not','or','repeat','return','then','true','until','while','goto']);
const BLACKLIST = new Set(['self','_G','_ENV','arg','...']);

function tokenize(src) {
  const T = [];
  let i = 0, n = src.length;
  while (i < n) {
    const c = src[i];
    if (/\s/.test(c)) { let s = i; while (i < n && /\s/.test(src[i])) i++; T.push({type:'ws', value:src.slice(s,i)}); continue; }
    if (c === '-' && src[i+1] === '-') {
      if (src[i+2] === '[') {
        const eq = matchLongBracket(src, i+2);
        if (eq !== null) { const close = ']'+'='.repeat(eq)+']'; const e = src.indexOf(close, i+2+eq+2); if (e===-1){T.push({type:'comment',value:src.slice(i)});i=n;}else{const end=e+close.length;T.push({type:'comment',value:src.slice(i,end)});i=end;} continue; }
      }
      let end = src.indexOf('\n', i); if (end===-1) end = n;
      T.push({type:'comment', value:src.slice(i,end)}); i=end; continue;
    }
    if (c === '[') {
      const eq = matchLongBracket(src, i);
      if (eq !== null) { const close = ']'+'='.repeat(eq)+']'; const s = i+eq+2; const e = src.indexOf(close, s); if (e===-1){T.push({type:'string',value:src.slice(i)});i=n;}else{const end=e+close.length;T.push({type:'string',value:src.slice(i,end)});i=end;} continue; }
    }
    if (c === '"' || c === "'") {
      const q = c; let j = i+1;
      while (j < n) { if (src[j] === '\\') { j+=2; continue; } if (src[j] === q) { j++; break; } if (src[j] === '\n') break; j++; }
      T.push({type:'string', value:src.slice(i,j)}); i=j; continue;
    }
    if (/[0-9]/.test(c) || (c==='.' && /[0-9]/.test(src[i+1]||''))) {
      let j = i;
      if (c==='0' && (src[i+1]==='x'||src[i+1]==='X')) { j=i+2; while(j<n && /[0-9a-fA-F.]/.test(src[j])) j++; if(src[j]==='p'||src[j]==='P'){j++;if(src[j]==='+'||src[j]==='-')j++;while(j<n&&/[0-9]/.test(src[j]))j++;} }
      else { while(j<n && /[0-9.]/.test(src[j])) j++; if(src[j]==='e'||src[j]==='E'){j++;if(src[j]==='+'||src[j]==='-')j++;while(j<n&&/[0-9]/.test(src[j]))j++;} }
      T.push({type:'number', value:src.slice(i,j)}); i=j; continue;
    }
    if (/[a-zA-Z_]/.test(c)) {
      let j = i; while (j<n && /[a-zA-Z0-9_]/.test(src[j])) j++;
      const w = src.slice(i,j); T.push({type: KEYWORDS.has(w)?'keyword':'ident', value:w}); i=j; continue;
    }
    const ops = ['...','..','==','~=','<=','>=','::','//','<<','>>'];
    let matched = false;
    for (const op of ops) { if (src.substr(i,op.length) === op) { T.push({type:'symbol', value:op}); i+=op.length; matched=true; break; } }
    if (matched) continue;
    T.push({type:'symbol', value:c}); i++;
  }
  return T;
}

function matchLongBracket(s, start) {
  let i = start+1, eq = 0;
  while (s[i]==='=') { eq++; i++; }
  return s[i]==='[' ? eq : null;
}

/* ===================== STRING ENCODE/DECODE ===================== */
function parseLuaString(tok) {
  const content = tok.slice(1, -1);
  let out = '', i = 0;
  while (i < content.length) {
    const c = content[i];
    if (c !== '\\') { out += c; i++; continue; }
    const nx = content[i+1];
    switch (nx) {
      case 'n': out+='\n'; i+=2; break; case 't': out+='\t'; i+=2; break;
      case 'r': out+='\r'; i+=2; break; case '\\': out+='\\'; i+=2; break;
      case '"': out+='"'; i+=2; break; case "'": out+="'"; i+=2; break;
      case 'x': { const h = content.substr(i+2,2); const v = parseInt(h,16); if(!isNaN(v)){out+=String.fromCharCode(v);i+=4;}else{out+='x';i+=2;} break; }
      default:
        if (/[0-9]/.test(nx)) { let num='',j=i+1; while(j<content.length&&/[0-9]/.test(content[j])&&num.length<3){num+=content[j];j++;} out+=String.fromCharCode(parseInt(num,10)&0xFF); i=j; }
        else { out += nx; i+=2; }
    }
  }
  return out;
}

function encodeStringToken(tok) {
  if (!tok.startsWith('"') && !tok.startsWith("'")) return tok;
  try {
    const s = parseLuaString(tok);
    const bytes = new TextEncoder().encode(s);
    let out = '"'; for (const b of bytes) out += '\\' + String(b).padStart(3,'0'); return out + '"';
  } catch(e) { return tok; }
}

function decodeStringToken(tok) {
  if (!tok.startsWith('"') && !tok.startsWith("'")) return tok;
  try {
    const s = parseLuaString(tok);
    // Chỉ trả về chuỗi bình thường nếu không chứa ký tự điều khiển (control chars)
    if (/[\x00-\x1F\x7F]/.test(s)) return tok; 
    return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
  } catch(e) { return tok; }
}

/* ===================== OBFUSCATOR ===================== */
function obfuscate(src, opts) {
  opts = Object.assign({ rename: true, strings: true, minify: true }, opts || {});
  const raw = tokenize(src);
  const T = [];
  for (const t of raw) if (t.type !== 'ws' && t.type !== 'comment') T.push(t);

  const rootScope = { parent: null, vars: new Map(), depth: 0 };
  const scopeStack = [rootScope]; let cur = rootScope; const openers = []; const tokScope = [];
  let mangleIdx = 0; const CHARS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  
  function mangle() { let n = mangleIdx++, s = ''; do { s = CHARS[n % 52] + s; n = Math.floor(n / 52); } while (n > 0); return '__R' + s; }
  function declare(scope, name) { if (BLACKLIST.has(name)||scope.vars.has(name)) return; scope.vars.set(name, opts.rename ? mangle() : name); }
  function resolve(scope, name) { let s = scope; while (s) { if (s.vars.has(name)) return s.vars.get(name); s = s.parent; } return null; }
  function pushScope(kind) { const ns = { parent: cur, vars: new Map(), depth: cur.depth + 1 }; scopeStack.push(ns); cur = ns; openers.push(kind); }
  function popScope() { cur = scopeStack.pop(); }

  for (let i = 0; i < T.length; i++) {
    const t = T[i]; tokScope[i] = cur;
    if (t.type !== 'keyword') continue;
    const kw = t.value;
    if (kw === 'function') {
      pushScope('function'); let j = i + 1;
      while (j < T.length && !(T[j].type==='symbol' && T[j].value==='(')) j++;
      if (j < T.length) {
        j++; let depth = 1, expectParam = true;
        while (j < T.length && depth > 0) {
          const tk = T[j];
          if (tk.type === 'symbol') {
            if (tk.value === '(') depth++; else if (tk.value === ')') { depth--; if (depth===0) break; }
            else if (tk.value === ',') expectParam = true;
          } else if (tk.type === 'ident' && expectParam) { declare(cur, tk.value); expectParam = false; }
          else if (tk.value === '...' && expectParam) expectParam = false;
          j++;
        }
      }
    } else if (kw === 'do') { pushScope('do'); }
    else if (kw === 'if') { pushScope('if'); }
    else if (kw === 'then') { pushScope('then'); }
    else if (kw === 'elseif') { if (openers.length) { openers.pop(); popScope(); } }
    else if (kw === 'else') { if (openers.length) { openers.pop(); popScope(); } pushScope('else'); }
    else if (kw === 'for') {
      pushScope('for'); let j = i + 1;
      while (j < T.length) {
        const tk = T[j]; if (tk.type==='keyword' && (tk.value==='in'||tk.value==='do')) break;
        if (tk.type==='symbol' && tk.value==='=') break; if (tk.type==='ident') declare(cur, tk.value); j++;
      }
    } else if (kw === 'while') { pushScope('while'); }
    else if (kw === 'repeat') { pushScope('repeat'); }
    else if (kw === 'end') {
      while (openers.length && (openers[openers.length-1]==='then'||openers[openers.length-1]==='else')) { openers.pop(); popScope(); }
      const opener = openers.pop(); if (opener) popScope();
      if (opener === 'do' && openers.length) { const below = openers[openers.length-1]; if (below==='for'||below==='while') { openers.pop(); popScope(); } }
    } else if (kw === 'until') { if (openers.length) { openers.pop(); popScope(); } }
    else if (kw === 'local') {
      let j = i + 1;
      if (j < T.length && T[j].type==='keyword' && T[j].value==='function') { j++; if (j<T.length && T[j].type==='ident') declare(cur, T[j].value); }
      else {
        while (j < T.length) {
          const tk = T[j];
          if (tk.type === 'ident') { declare(cur, tk.value); j++; continue; }
          if (tk.type === 'symbol' && tk.value === ',') { j++; continue; } break;
        }
      }
    }
  }

  let out = ''; let pType = null, pVal = '';
  function needSpace(pt,pv,ct,cv) {
    if (!pt) return false; const wordy = new Set(['ident','keyword','number']);
    if (wordy.has(pt) && wordy.has(ct)) return true;
    if (pt==='string' && wordy.has(ct)) return true; if (wordy.has(pt) && ct==='string') return true;
    if (pt==='symbol' && pv==='-' && ct==='symbol' && cv.startsWith('-')) return true;
    if (pt==='number' && ct==='symbol' && cv==='..') return true; if (pt==='symbol' && pv==='.' && ct==='number') return true;
    return false;
  }

  for (let i = 0; i < T.length; i++) {
    const t = T[i]; let v;
    if (t.type === 'ident') { const m = opts.rename ? resolve(tokScope[i], t.value) : null; v = m || t.value; }
    else if (t.type === 'string' && opts.strings) { v = encodeStringToken(t.value); }
    else { v = t.value; }
    if (opts.minify) { if (needSpace(pType,pVal,t.type,v)) out += ' '; }
    else { if (pType && !(t.type==='symbol' && (t.value===','||t.value===')'||t.value===']'))) out += ' '; }
    out += v; pType = t.type; pVal = v;
  }
  return out;
}

/* ===================== DEOBFUSCATOR / BEAUTIFIER ===================== */
function deobfuscate(src) {
  const raw = tokenize(src);
  
  // 1. Dịch ngược chuỗi (String Decoder)
  for (let t of raw) {
    if (t.type === 'string') {
      t.value = decodeStringToken(t.value);
    }
  }

  // 2. Làm đẹp code (Beautifier)
  let out = '';
  let indent = 0;
  const INDENT_STR = '    '; // 4 spaces
  let pType = null, pVal = '';

  function needSpace(pt,pv,ct,cv) {
    if (!pt) return false; const wordy = new Set(['ident','keyword','number']);
    if (wordy.has(pt) && wordy.has(ct)) return true;
    if (pt==='string' && wordy.has(ct)) return true; if (wordy.has(pt) && ct==='string') return true;
    if (pt==='number' && ct==='symbol' && cv==='..') return true;
    if (pt==='symbol' && pv==='.' && ct==='number') return true;
    return false;
  }

  function addNewline() {
    out = out.trimEnd() + '\n' + INDENT_STR.repeat(indent);
  }

  for (let i = 0; i < raw.length; i++) {
    const t = raw[i];
    
    // Bỏ qua comment và whitespace thừa
    if (t.type === 'ws') continue;
    if (t.type === 'comment') {
      out += t.value + '\n' + INDENT_STR.repeat(indent);
      pType = null;
      continue;
    }

    const v = t.value;

    // Xử lý giảm thụt lề (End, Else, Elseif, Until)
    if (t.type === 'keyword' && ['end', 'else', 'elseif', 'until'].includes(v)) {
      indent = Math.max(0, indent - 1);
      if (out.trim() !== '' && !out.endsWith('\n')) addNewline();
      else if (out.endsWith('\n')) out += INDENT_STR.repeat(indent); // fix indent
    }

    // Thêm khoảng trắng hợp lý
    if (needSpace(pType, pVal, t.type, v)) out += ' ';
    
    out += v;

    // Xử lý tăng thụt lề (Then, Do)
    if (t.type === 'keyword' && ['then', 'do'].includes(v)) {
      indent++;
      addNewline();
    } 
    // Xử lý khối Repeat/Until
    else if (t.type === 'keyword' && v === 'repeat') {
      indent++;
      addNewline();
    }
    // Xử lý dấu chấm phẩy (nếu có)
    else if (t.type === 'symbol' && v === ';') {
      addNewline();
    }

    pType = t.type;
    pVal = v;
  }
  
  return out.trim();
}

/* ===================== UI CONTROL ===================== */
const $in = document.getElementById('input');
const $out = document.getElementById('output');
const $stats = document.getElementById('stats');
const $inSize = document.getElementById('inSize');
const $outSize = document.getElementById('outSize');
const $copy = document.getElementById('copyBtn');
const $dl = document.getElementById('dlBtn');

$in.addEventListener('input', () => { $inSize.textContent = $in.value.length + ' ký tự'; });

function run() {
  const src = $in.value;
  if (!src.trim()) { $stats.innerHTML = '<span class="err">⚠️ Chưa có code</span>'; return; }
  
  try {
    const t0 = performance.now();
    let res = '';
    
    if (currentMode === 'obf') {
      const opts = {
        rename: document.getElementById('optRename').checked,
        strings: document.getElementById('optStrings').checked,
        minify: document.getElementById('optMinify').checked
      };
      res = obfuscate(src, opts);
    } else {
      res = deobfuscate(src);
    }
    
    const t1 = performance.now();
    $out.value = res;
    $outSize.textContent = res.length + ' ký tự';
    $copy.disabled = false; $dl.disabled = false;
    
    const action = currentMode === 'obf' ? 'Xáo trộn' : 'Giải mã';
    $stats.innerHTML = `<span class="ok">✓</span> ${action} xong trong ${(t1-t0).toFixed(1)}ms · Kích thước: ${src.length} → ${res.length} ký tự`;
    
  } catch (e) {
    $stats.innerHTML = `<span class="err">❌ ${e.message}</span>`;
  }
}

function copyOut() {
  if (!$out.value) return;
  navigator.clipboard.writeText($out.value).then(() => {
    const o = $copy.textContent; $copy.textContent = '✅ Đã copy!';
    setTimeout(() => $copy.textContent = o, 1400);
  }).catch(() => { $out.select(); document.execCommand('copy'); });
}

function download() {
  if (!$out.value) return;
  const blob = new Blob([$out.value], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentMode === 'obf' ? 'obfuscated.lua' : 'deobfuscated.lua';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function clearAll() {
  $in.value = ''; $out.value = '';
  $inSize.textContent = '0 ký tự'; $outSize.textContent = '0 ký tự';
  $stats.innerHTML = '';
  $copy.disabled = true; $dl.disabled = true;
}
</script>
</body>
</html>
